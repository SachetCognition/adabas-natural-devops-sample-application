spring:
  application:
    name: ntcruise-migration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ntcruise}
    username: ${DB_USERNAME:ntcruise}
    password: ${DB_PASSWORD:ntcruise}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.ntcruise: INFO
    org.springframework.web: INFO
