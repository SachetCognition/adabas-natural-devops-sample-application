name: Java Migration CI/CD

on:
  push:
    branches: [ master, 'devin/**' ]
    paths:
      - 'java-migration/**'
      - '.github/workflows/java-migration-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'java-migration/**'
      - '.github/workflows/java-migration-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ntcruise
          POSTGRES_USER: ntcruise
          POSTGRES_PASSWORD: ntcruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        working-directory: java-migration
        run: mvn clean compile -B

      - name: Run unit tests
        working-directory: java-migration
        run: mvn test -B

      - name: Run integration tests
        working-directory: java-migration
        run: mvn verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ntcruise
          DB_USERNAME: ntcruise
          DB_PASSWORD: ntcruise

      - name: Package application
        working-directory: java-migration
        run: mvn package -B -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: java-migration/target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntcruise-migration-jar
          path: java-migration/target/*.jar
